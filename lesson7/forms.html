<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>     
        <legend>Personal Information:</legend>
         <label for="firstname">FirstName:</label><br>
        <input type="text" id="firstname" name="firstname" placeholder="Art" value="Art" readonly><br><br>
        <label for="lastname"> LastName</label><br>
        <input type="text" id="lastname" name="lastname" placeholder="Sylejmani" disabled><br><br>   
        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="art@gmail.com" required><br><br>
        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="*******" required><br><br>
        <label>Gender:</label> <br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label><br>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>
        <label>Hobbies:</label><br>
        <input type="checkbox" id="gaming" name="gaming" value="Gaming">
        <label for="gaming">Gaming</label><br>
        <input type="checkbox" id="football" name="football" value="Football">
        <label for="football">Football</label><br>
        <input type="checkbox" name="swimmming" id="swimming" value="Swimming">
        <label for="swimming">Swimming</label><br><br>
        <select name="pet" id="pet">
            <option value="Dog">Dog</option>
             <option value="Cat">Cat</option>
              <option value="Parrot">Parrot</option>
               <option value="Lion">Lion</option>
        </select><br><br>
        <textarea name="message" cols="30" rows="10" maxlength="50"></textarea><br><br>
        <input type="submit" name="submit" id="submit"><br> </fieldset>
    </form>
</body>
</html>
